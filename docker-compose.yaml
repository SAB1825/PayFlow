services:
  kurrentdb:
    image: docker.kurrent.io/kurrent-lts/kurrentdb:latest
    container_name: nestjs-es-kurrentdb
    environment:
      KURRENTDB_CLUSTER_SIZE: 1
      KURRENTDB_RUN_PROJECTIONS: All
      KURRENTDB_START_STANDARD_PROJECTIONS: "true"
      KURRENTDB_NODE_PORT: 2113
      KURRENTDB_INSECURE: "true"
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: "true" # stream browser in the admin UI
    ports:
      - "2113:2113" # gRPC + admin UI → http://localhost:2113
    volumes:
      - kurrentdb_data:/var/lib/kurrentdb
      - kurrentdb_logs:/var/log/kurrentdb
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:2113/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  kurrentdb_data:
  kurrentdb_logs:
